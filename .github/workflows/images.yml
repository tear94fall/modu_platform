# 서비스 이미지 빌드·푸시
#
# 흐름
#   PR(develop·master 대상)  : 바뀐 서비스만 테스트 + 이미지 빌드(푸시 없음). 빌드가 깨지는 PR 을 걸러낸다.
#   develop / master 푸시    : 바뀐 서비스만 테스트 + 빌드 + GHCR 푸시.
#   workflow_dispatch        : 모든 서비스를 테스트 + 빌드. develop·master 에서 돌리면 푸시도 한다.
#
# 이미지 이름  ghcr.io/tear94fall/modu-platform/<service>
# 태그         develop 푸시 → develop-<sha7>, develop   /   master 푸시 → master-<sha7>, latest
#
# 이미지는 각 서비스 디렉터리의 Dockerfile 로 만든다(로컬 `docker compose up -d --build` 와 같은 파일).
# config-repo/ 는 config-service 가 런타임에 볼륨(ConfigMap, 루트 kustomization.yaml)으로 마운트하므로 이미지에 들어가지 않고, 바뀌어도 빌드를 일으키지 않는다(config-repo job 이 kustomization 만 검사).
# GHCR 패키지는 첫 푸시 때 private 으로 생기므로 GitHub UI(Packages → Package settings)에서 한 번 public 으로 바꿔야 한다.

name: images

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # 어떤 서비스가 바뀌었는지 가려낸다. 서비스 디렉터리 또는 이 워크플로 파일이 바뀌면 그 서비스를 빌드한다.
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            config-service:
              - 'config-service/**'
              - '.github/workflows/images.yml'
            gateway-service:
              - 'gateway-service/**'
              - '.github/workflows/images.yml'
            deploy-service:
              - 'deploy-service/**'
              - '.github/workflows/images.yml'
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo 'services=["config-service","gateway-service","deploy-service"]' >> "$GITHUB_OUTPUT"
          else
            echo "services=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

  # config-repo → ConfigMap kustomization 검사: 모든 config-repo 파일이 kustomization.yaml 에 들어 있고 빌드가 되는지(Argo CD Application modu-config-repo 가 이걸 적용한다).
  config-repo:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check config-repo kustomization
        run: |
          ./k8s-check.sh
          kubectl kustomize . > /dev/null && echo "kustomize build ok"

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    concurrency:
      group: images-${{ github.ref }}-${{ matrix.service }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # 테스트는 여기서만 돈다(Dockerfile 은 -x test).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: ${{ matrix.service }}
        run: ./gradlew test

      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: (github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # develop → develop-<sha7> + develop, master → master-<sha7> + latest. PR 은 태그만 계산하고 푸시하지 않는다.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/modu-platform/${{ matrix.service }}
          tags: |
            type=sha,prefix=${{ github.ref_name }}-,format=short,enable=${{ (github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')) }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ (github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
