name: modu-platform

# modu 프로젝트 공용 플랫폼: 설정 서버, API 게이트웨이.
# 기동 순서: modu_infra(네트워크·데이터·관측성) → 이 스택 → modu_messenger backend / modu_commerce backend.
# 다른 저장소의 서비스는 external 네트워크 modu-infra 에서 컨테이너 이름(config-service, gateway-service)으로 붙는다.
# 서비스 레지스트리는 없다. 서비스끼리·게이트웨이는 config-repo 의 modu.services.* 주소(컨테이너 이름:포트)를 DNS 로 푼다.
# 이미지: GitHub Actions(.github/workflows/images.yml)가 develop/master 푸시마다 GHCR 에 올린다(ghcr.io/tear94fall/modu-platform/<service>).
#   docker compose pull && docker compose up -d   → CI 이미지(IMAGE_TAG 로 태그 선택, 기본 develop)
#   docker compose up -d --build                  → 로컬 빌드(같은 Dockerfile, 소스에서 jar 까지 만든다)

# 모든 컨테이너 로그 줄에 compose 서비스·프로젝트 이름을 붙인다(json-file attrs). OTel Collector 가 container 필드와 앱/인프라 인덱스 구분에 쓴다(modu_infra monitoring).
x-logging: &logging
  driver: json-file
  options:
    labels: com.docker.compose.service,com.docker.compose.project
    max-size: "50m"
    max-file: "3"

# 컨테이너 메모리 제한. JVM 은 -XX:MaxRAMPercentage=75 로 이 안에서 힙을 잡는다(1g → 힙 최대 768MiB).
# k8s 의 resources.requests(mem_reservation)/limits(mem_limit) 와 같은 값으로 매니페스트에 옮긴다.
x-jvm-resources: &jvm-resources
  mem_limit: 1g
  mem_reservation: 512m
x-small-resources: &small-resources
  mem_limit: 64m
  mem_reservation: 16m

services:
  config-service:
    image: ghcr.io/tear94fall/modu-platform/config-service:${IMAGE_TAG:-develop}
    build:
      context: ./config-service
      dockerfile: ./Dockerfile
    container_name: config-service
    logging: *logging
    <<: *jvm-resources
    ports:
      - 8888:8888
    environment:
      - ENCRYPT_KEY=${ENCRYPT_KEY:?.env 에 ENCRYPT_KEY 를 설정하세요}
      # 관리 콘솔용 config-repo 조회(/api-admin)는 게이트웨이가 붙이는 이 토큰으로만 연다.
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?.env 에 INTERNAL_API_TOKEN 을 설정하세요}
      - RABBITMQ_HOST=rabbitmq
      # Pinpoint 에이전트가 트랜잭션 id(PtxId·PspanId)를 MDC 에 넣어 로그 줄과 Pinpoint 호출 트리를 잇는다. 에이전트가 없으면 무시된다.
      - JAVA_TOOL_OPTIONS=${CONFIG_AGENT_OPTS:-} -Dprofiler.logback.logging.transactioninfo=true
    volumes:
      - ./config-repo:/config-repo:ro
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    # readiness: 앱이 떴고 설정 저장소(/config-repo)를 읽을 수 있을 때만 UP. 다른 스택의 depends_on: service_healthy 게이트.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    # SIGTERM 뒤 graceful shutdown(처리 중인 요청 완료, 최대 20s)이 끝날 때까지 기다린다.
    stop_grace_period: 30s
    restart: always

  gateway-service:
    image: ghcr.io/tear94fall/modu-platform/gateway-service:${IMAGE_TAG:-develop}
    build:
      context: ./gateway-service
      dockerfile: ./Dockerfile
    container_name: gateway-service
    logging: *logging
    <<: *jvm-resources
    ports:
      - 8000:8000
    environment:
      - CONFIG_SERVER_URI=http://config-service:8888
      # Pinpoint 에이전트가 트랜잭션 id(PtxId·PspanId)를 MDC 에 넣어 로그 줄과 Pinpoint 호출 트리를 잇는다. 에이전트가 없으면 무시된다.
      - JAVA_TOOL_OPTIONS=${GATEWAY_AGENT_OPTS:-} -Dprofiler.logback.logging.transactioninfo=true
      - ADMIN_ALLOWED_ORIGIN=${ADMIN_ALLOWED_ORIGIN:-http://localhost:5173}
      # 내부 호출 토큰은 config-repo application.yml 의 modu.internal-api.token({cipher})에서 받는다.
    depends_on:
      config-service:
        condition: service_healthy
    volumes:
      - pinpoint-agent:/pinpoint-agent:ro
    networks:
      - modu-infra
      - pinpoint
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/actuator/health/readiness | grep -q '\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s
    restart: always

networks:
  modu-infra:
    external: true
  pinpoint:
    external: true
    name: pinpoint-docker_pinpoint

volumes:
  pinpoint-agent:
    external: true
    name: pinpoint-docker_data-volume
