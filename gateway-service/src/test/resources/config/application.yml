# 테스트는 설정 서버 없이 뜬다. main 의 fail-fast 때문에 여기서 config 클라이언트를 끈다.
# classpath:/config/application.yml 은 main 의 application.yml 을 가리지 않고 그 위에 덧붙는다.
spring:
  cloud:
    config:
      enabled: false
# 테스트가 로컬에 떠 있는 Eureka(localhost:8761)에 instance-id gateway-service 로 등록·해제하지 않게 끈다
# (실제 게이트웨이와 같은 id 라 해제하면 그쪽 등록이 지워진다). lb:// 는 인스턴스가 없어 503 이 된다.
eureka:
  client:
    enabled: false
