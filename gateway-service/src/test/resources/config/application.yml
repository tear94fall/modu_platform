# 테스트는 설정 서버 없이 뜬다. main 의 fail-fast 때문에 여기서 config 클라이언트를 끈다.
# classpath:/config/application.yml 은 main 의 application.yml 을 가리지 않고 그 위에 덧붙는다.
spring:
  cloud:
    config:
      enabled: false
# 실제로는 config-repo 가 내려주는 서비스 주소. 테스트에선 아무것도 듣지 않는 localhost 포트라 라우트를 지나면 연결 실패(5xx)가 된다.
# 서비스마다 포트를 다르게 둬서 API 문서 목록이 라우트 uri 로 서비스 이름을 되찾을 수 있게 한다(ServiceAddresses.nameOf).
modu:
  services:
    auth-service: http://localhost:1
    member-service: http://localhost:2
    chat-service: http://localhost:3
    chat-store-service: http://localhost:4
    ws-service: http://localhost:5
    push-service: http://localhost:6
    storage-service: http://localhost:7
    profile-service: http://localhost:8
    point-service: http://localhost:9
    schedule-service: http://localhost:10
    commerce-service: http://localhost:11
