server:
  port: 8000
  # SIGTERM 뒤 새 요청은 거절하고 처리 중인 요청은 끝까지 보낸다(Netty 도 지원). 롤링 배포·재시작 때 요청이 끊기지 않게.
  shutdown: graceful

modu:
  # 서비스 주소(modu.services.<이름>: http://<호스트>:<포트>)는 config-repo 의 application.yml 이 내려준다(모든 서비스 공통).
  # 라우트 uri 와 API 문서 조회가 모두 그 값을 쓴다. compose 에선 컨테이너 이름, k8s 에선 같은 이름·포트의 Service.
  # 시스템 콘솔 'API 문서'(ApiDocsController). 목록은 라우트 uri 가 가리키는 modu.services 서비스 + 아래 서비스(이름 → 주소).
  # 라우트가 없는 서비스(chat-store, schedule)는 문서만 보이고 Try it out 은 꺼진다.
  api-docs:
    extra-services:
      chat-store-service: ${modu.services.chat-store-service}
      schedule-service: ${modu.services.schedule-service}
  oauth:
    # config-repo 가 덮어쓴다. 게이트웨이는 컨테이너 이름으로 auth-service 의 JWKS 를 직접 읽는다.
    issuer: ${MODU_OAUTH_ISSUER:http://192.168.0.3:8000/auth-service}
    jwks-uri: ${MODU_OAUTH_JWKS_URI:http://auth-service:9900/oauth2/jwks}

spring:
  application:
    name: gateway-service

  lifecycle:
    timeout-per-shutdown-phase: 20s
  # oauth2-resource-server 스타터가 끌어온 Spring Security 자동 설정 중 기본 사용자·리소스 서버는 끈다.
  # 전 경로 permitAll 체인은 jwt/GatewaySecurityConfig 가 두고, 인증은 라우트별 AuthorizationHeaderFilter 가 JWKS 로 한다.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.reactive.ReactiveOAuth2ResourceServerAutoConfiguration

  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

  cloud:
    # 설정 서버를 못 만나면 기본값으로 조용히 뜨지 않고 기동에 실패한다(restart: always 가 다시 띄운다). 메신저·커머스 서비스와 같은 규칙.
    # 서비스 주소(modu.services.*)도 config-repo 에서 오므로 설정 없이는 라우트를 만들 수 없다
    # (데몬 자동 재시작은 depends_on 순서를 지키지 않아 config-service 보다 먼저 뜰 수 있다).
    config:
      fail-fast: true
    gateway:
      # 외부 요청이 들고 온 내부 토큰 헤더는 항상 떼어낸다. 내부 토큰은 서비스 간 Feign 만 붙인다.
      default-filters:
        - RemoveRequestHeader=X-Internal-Token
      # 백오피스(브라우저)용 CORS. 허용 origin 은 modu.admin.allowed-origin.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${modu.admin.allowed-origin:http://localhost:5173}
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600
      routes:
        # ---- 인증 없이 통과하는 public 엔드포인트 (와일드카드보다 먼저 매칭돼야 한다) ----
        - id: auth-service-oauth2
          uri: ${modu.services.auth-service}
          predicates:
            - Path=/auth-service/oauth2/token,/auth-service/oauth2/revoke,/auth-service/oauth2/jwks,/auth-service/oauth2/introspect,/auth-service/userinfo,/auth-service/.well-known/**
          filters:
            - RewritePath=/auth-service/(?<segment>.*), /$\{segment}
        - id: auth-service-public
          uri: ${modu.services.auth-service}
          predicates:
            - Path=/auth-service/api-public/**
          filters:
            - AuthorizationHeaderFilter=ROLE_USER,modu-chat
            - RewritePath=/auth-service/(?<segment>.*), /$\{segment}
        - id: member-service-public
          uri: ${modu.services.member-service}
          predicates:
            - Path=/member-service/api-public/**
          filters:
            - AuthorizationHeaderFilter=ROLE_USER,modu-chat
            - RewritePath=/member-service/(?<segment>.*), /$\{segment}
        - id: chat-service-public
          uri: ${modu.services.chat-service}
          predicates:
            - Path=/chat-service/api-public/**
          filters:
            - AuthorizationHeaderFilter=ROLE_USER,modu-chat
            - RewritePath=/chat-service/(?<segment>.*), /$\{segment}
        - id: profile-service-public
          uri: ${modu.services.profile-service}
          predicates:
            - Path=/profile-service/api-public/**
          filters:
            - AuthorizationHeaderFilter=ROLE_USER,modu-chat
            - RewritePath=/profile-service/(?<segment>.*), /$\{segment}
        - id: storage-service-public
          uri: ${modu.services.storage-service}
          predicates:
            - Path=/storage-service/api-public/**
          filters:
            - AuthorizationHeaderFilter=ROLE_USER,modu-chat
            - RewritePath=/storage-service/(?<segment>.*), /$\{segment}
        - id: push-service-public
          uri: ${modu.services.push-service}
          predicates:
            - Path=/push-service/api-public/**
          filters:
            - AuthorizationHeaderFilter=ROLE_USER,modu-chat
            - RewritePath=/push-service/(?<segment>.*), /$\{segment}
        - id: point-service-public
          uri: ${modu.services.point-service}
          predicates:
            - Path=/point-service/api-public/**
          filters:
            - AuthorizationHeaderFilter=ROLE_USER,modu-chat
            - RewritePath=/point-service/(?<segment>.*), /$\{segment}
        # 커머스 앱(modu_commerce web·Android). 회원 등급표만 로그인 없이 GET 으로 열고(아래 catch-all 보다 먼저),
        # 나머지는 커머스 앱 토큰(aud=modu-commerce)이 필요하다. commerce 도 JWT 를 다시 검증한다.
        - id: commerce-service-public-open
          uri: ${modu.services.commerce-service}
          predicates:
            - Path=/commerce-service/api-public/v1/tiers
            - Method=GET
          filters:
            - RewritePath=/commerce-service/(?<segment>.*), /$\{segment}
        - id: commerce-service-public
          uri: ${modu.services.commerce-service}
          predicates:
            - Path=/commerce-service/api-public/**
          filters:
            - AuthorizationHeaderFilter=ROLE_USER,modu-commerce
            - RewritePath=/commerce-service/(?<segment>.*), /$\{segment}

        # ---- admin 계층. ROLE_ADMIN JWT 를 검사하고, 통과한 요청에만 내부 토큰을 붙여 넘긴다 ----
        - id: member-service-admin
          uri: ${modu.services.member-service}
          predicates:
            - Path=/member-service/api-admin/**
          filters:
            - AuthorizationHeaderFilter=ROLE_ADMIN,modu-admin
            - AddRequestHeader=X-Internal-Token, ${modu.internal-api.token}
            - RewritePath=/member-service/(?<segment>.*), /$\{segment}
        - id: chat-service-admin
          uri: ${modu.services.chat-service}
          predicates:
            - Path=/chat-service/api-admin/**
          filters:
            - AuthorizationHeaderFilter=ROLE_ADMIN,modu-admin
            - AddRequestHeader=X-Internal-Token, ${modu.internal-api.token}
            - RewritePath=/chat-service/(?<segment>.*), /$\{segment}
        - id: push-service-admin
          uri: ${modu.services.push-service}
          predicates:
            - Path=/push-service/api-admin/**
          filters:
            - AuthorizationHeaderFilter=ROLE_ADMIN,modu-admin
            - AddRequestHeader=X-Internal-Token, ${modu.internal-api.token}
            - RewritePath=/push-service/(?<segment>.*), /$\{segment}

        - id: storage-service-admin
          uri: ${modu.services.storage-service}
          predicates:
            - Path=/storage-service/api-admin/**
          filters:
            - AuthorizationHeaderFilter=ROLE_ADMIN,modu-admin
            - AddRequestHeader=X-Internal-Token, ${modu.internal-api.token}
            - RewritePath=/storage-service/(?<segment>.*), /$\{segment}

        - id: point-service-admin
          uri: ${modu.services.point-service}
          predicates:
            - Path=/point-service/api-admin/**
          filters:
            - AuthorizationHeaderFilter=ROLE_ADMIN,modu-admin
            - AddRequestHeader=X-Internal-Token, ${modu.internal-api.token}
            - RewritePath=/point-service/(?<segment>.*), /$\{segment}

        # ---- 직원 콘솔(모두 인터널) 계층. 회원 조회는 인터널 권한, 직원 지정·권한 변경은 최상위 관리자만 ----
        # 두 계층은 첫 경로 조각부터 다르다(api-staff / api-super). 한 계층 안에 좁은 경로를 두면
        # 톰캣이 // 를 합치는 탓에 /api-staff//staff 가 넓은 라우트를 지나 좁은 경로에 닿을 수 있다.
        - id: member-service-super
          uri: ${modu.services.member-service}
          predicates:
            - Path=/member-service/api-super/**
          filters:
            - AuthorizationHeaderFilter=ROLE_SUPER,modu-admin
            - AddRequestHeader=X-Internal-Token, ${modu.internal-api.token}
            - RewritePath=/member-service/(?<segment>.*), /$\{segment}
        - id: member-service-staff
          uri: ${modu.services.member-service}
          predicates:
            - Path=/member-service/api-staff/**
          filters:
            - AuthorizationHeaderFilter=ROLE_INTERNAL,modu-admin
            - AddRequestHeader=X-Internal-Token, ${modu.internal-api.token}
            - RewritePath=/member-service/(?<segment>.*), /$\{segment}

        # config-service 는 설정 서버 주소(CONFIG_SERVER_URI)로 간다. modu.services 에는 없으므로 API 문서 목록에도 안 잡힌다.
        # 모두 시스템의 config-repo 조회. 설정 서버는 JWT 를 모르므로 여기서 시스템 권한(ROLE_SYSTEM)을 보고 내부 토큰을 붙인다.
        - id: config-service-admin
          uri: ${CONFIG_SERVER_URI:http://localhost:8888}
          predicates:
            - Path=/config-service/api-admin/**
          filters:
            - AuthorizationHeaderFilter=ROLE_SYSTEM,modu-admin
            - AddRequestHeader=X-Internal-Token, ${modu.internal-api.token}
            - RewritePath=/config-service/(?<segment>.*), /$\{segment}

        # commerce-service(별도 저장소 modu_commerce)도 modu.services 의 주소로 간다.
        # 내부 토큰 대신 commerce 가 Authorization 헤더의 JWT(aud=modu-admin, ROLE_ADMIN)를 다시 검증한다.
        - id: commerce-service-admin
          uri: ${modu.services.commerce-service}
          predicates:
            - Path=/commerce-service/api-admin/**
          filters:
            - AuthorizationHeaderFilter=ROLE_ADMIN,modu-admin
            - RewritePath=/commerce-service/(?<segment>.*), /$\{segment}

        # ---- WebSocket. HTTP API 계층과 무관하므로 경로 그대로 ----
        # uri 는 http:// 지만 Upgrade: websocket 요청은 게이트웨이(WebsocketRoutingFilter)가 ws:// 로 바꿔 프록시한다(WebSocketRouteTest).
        # metadata.websocket 은 API 문서 목록이 '이 라우트는 HTTP API 경로가 아니다'로 알아보는 표시(ApiDocsService).
        - id: ws-service
          uri: ${modu.services.ws-service}
          metadata:
            websocket: true
          predicates:
            - Path=/ws-service/modu-chat/**
          filters:
            - AuthorizationHeaderFilter=ROLE_USER,modu-chat
            - RewritePath=/ws-service/(?<segment>.*), /$\{segment}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      # /actuator/health/liveness, /actuator/health/readiness (쿠버네티스 probe·compose healthcheck 용).
      # 게이트웨이 자신의 actuator 다. 라우트는 모두 /<서비스>/... 로 시작하므로 /actuator 를 잡는 라우트는 없다(GatewayRoutesTest).
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # 게이트웨이가 떴는지만 본다. 뒤 서비스가 떠 있는지나 설정 서버 연결은 readiness 조건이 아니다.
          include: readinessState
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
