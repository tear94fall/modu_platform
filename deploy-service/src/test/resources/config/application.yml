# 테스트는 설정 서버 없이 뜬다. main 의 fail-fast 때문에 여기서 config 클라이언트를 끈다.
# classpath:/config/application.yml 은 main 의 application.yml 을 가리지 않고 그 위에 덧붙는다.
spring:
  cloud:
    config:
      enabled: false

  # 배포 이력 DB 는 H2(MySQL 모드). 실제로는 config-repo/deploy-service.yml 이 master(mysql-platform)·replica(mysql-platform-replica) 주소를
  # 내려주고 ddl-auto 는 validate. 테스트는 master·replica 가 같은 H2 DB 를 본다(복제 대신) — 다른 URL 이면 replica 가 비어 목록이 안 보인다.
  # ddl-auto: update 는 RW 에만 적용되고(RO 는 hbm2ddl none) 엔티티에서 표를 만든다.
  datasource:
    master:
      url: jdbc:h2:mem:deploy;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
      username: sa
      password:
      driver-class-name: org.h2.Driver
      # main 의 SET SESSION innodb_lock_wait_timeout 은 MySQL 전용 — H2 는 URL 의 LOCK_TIMEOUT(10초)으로 잠금 대기를 정한다.
      hikari:
        connection-init-sql: SELECT 1
    replica:
      url: jdbc:h2:mem:deploy;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
      username: sa
      password:
      driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

modu:
  internal-api:
    token: test-token
  services:
    member-service: http://localhost:12

# 실제로는 config-repo/deploy-service.yml 이 내려주는 값. 테스트는 네트워크·클러스터 없이 돌고 외부 게이트웨이는 mock 으로 바꾼다.
deploy:
  github:
    api-url: http://localhost:1
    owner: tear94fall
    infra-repo: modu_infra
    infra-branch: main
    kustomization-path: k8s/overlays/dev/kustomization.yaml
    token: test-github-token
  argocd:
    url: http://localhost:2
    application: modu-dev
    token: test-argocd-token
  kubernetes:
    namespace: modu
  services:
    - name: point-service
      repo: modu_chat
      image: ghcr.io/tear94fall/modu-chat/point-service
    - name: gateway-service
      repo: modu_platform
      image: ghcr.io/tear94fall/modu-platform/gateway-service
