# 모든 제품(메신저·커머스)의 서비스가 공유하는 설정. 제품 전용 설정은 messenger/, commerce/ 에 둔다.
# 시크릿은 config-service 가 {cipher} 를 복호화해 평문으로 내려주므로 클라이언트에는 별도 설정이 필요 없다.
# 복호화 키는 modu_platform/.env 의 ENCRYPT_KEY 다.
# 서비스 간(Feign) 호출 식별 토큰. /api-internal/** 은 이 값이 X-Internal-Token 헤더로
# 와야만 통과한다. 플레이스홀더는 각 서비스 컨테이너의 환경변수로 풀린다 — 세 저장소(platform, messenger,
# commerce)의 .env 에 같은 INTERNAL_API_TOKEN 이 있어야 하고, prod 에서는 강한 값을 넣어야 한다.
modu:
  internal-api:
    token: ${INTERNAL_API_TOKEN:modu-internal-dev-token}

  # 백오피스 CORS 출처(gateway). 관리자 비밀번호 해시는 auth-service 전용이라 messenger/messenger.yml 에 있다.
  admin:
    allowed-origin: ${ADMIN_ALLOWED_ORIGIN:http://localhost:5173}
  oauth:
    # 토큰을 검증하는 쪽(gateway, commerce)이 읽는 공개 정보. 발급자 전용(RSA 키·클라이언트·TTL)은 messenger/messenger.yml 에 있다.
    issuer: http://192.168.0.3:8000/auth-service
    jwks-uri: http://auth-service:9900/oauth2/jwks
    google:
      # 앱들이 requestIdToken 에 쓰는 웹 클라이언트 ID(비밀 아님). ID 토큰의 aud 가 이 값이어야 한다.
      audiences: [529862674339-34f6a7he3npv9kkufh8u8ie6mma3f92j.apps.googleusercontent.com]
eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
