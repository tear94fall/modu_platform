# 모든 제품(메신저·커머스)의 서비스가 공유하는 설정. 제품 전용 설정은 messenger/, commerce/ 에 둔다.
# 시크릿은 config-service 가 {cipher} 를 복호화해 평문으로 내려주므로 클라이언트에는 별도 설정이 필요 없다.
# 복호화 키는 modu_platform/.env 의 ENCRYPT_KEY 다.
# 서비스 간(Feign) 호출 식별 토큰. /api-internal/** 은 이 값이 X-Internal-Token 헤더로 와야만 통과한다.
# 모든 서비스·게이트웨이가 여기서 받는다. config-service 자신은 이 파일을 읽지 않으므로 같은 값을
# modu_platform/.env 의 INTERNAL_API_TOKEN 으로도 준다(둘이 같아야 한다 — README '시크릿 지도').
modu:
  internal-api:
    token: '{cipher}40760f31c00e185c183e98dea8d8c4ae100710e7fb666b925f39a52f821ad31b3b79fb21d4f781787b97176f89948a21757076b521b6a3f12dcea5b9bf2ec105'

  # 백오피스 CORS 출처(gateway). 관리자 비밀번호 해시는 auth-service 전용이라 messenger/messenger.yml 에 있다.
  admin:
    allowed-origin: ${ADMIN_ALLOWED_ORIGIN:http://localhost:5173}
  oauth:
    # 토큰을 검증하는 쪽(gateway, commerce)이 읽는 공개 정보. 발급자 전용(RSA 키·클라이언트·TTL)은 messenger/messenger.yml 에 있다.
    issuer: http://192.168.0.3:8000/auth-service
    jwks-uri: http://auth-service:9900/oauth2/jwks
    google:
      # 앱들이 requestIdToken 에 쓰는 웹 클라이언트 ID(비밀 아님). ID 토큰의 aud 가 이 값이어야 한다.
      audiences: [529862674339-34f6a7he3npv9kkufh8u8ie6mma3f92j.apps.googleusercontent.com]

  services:
    # 서비스끼리·게이트웨이가 부르는 주소. compose 에선 컨테이너 이름, k8s 에선 같은 이름·포트의 Service 로 맞춘다.
    auth-service: http://auth-service:9900
    member-service: http://member-service:8080
    chat-service: http://chat-service:9090
    chat-store-service: http://chat-store-service:8100
    ws-service: http://ws-service:8090
    push-service: http://push-service:9990
    storage-service: http://storage-service:9999
    profile-service: http://profile-service:8880
    point-service: http://point-service:9600
    schedule-service: http://schedule-service:8110
    commerce-service: http://commerce-service:8200
    deploy-service: http://deploy-service:8900
