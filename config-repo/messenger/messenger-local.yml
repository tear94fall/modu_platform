# IDE 실행(local 프로필): 서비스 주소를 localhost 로 바꾼다(포트는 application.yml 의 modu.services 와 같다).
modu:
  services:
    auth-service: http://localhost:9900
    member-service: http://localhost:8080
    chat-service: http://localhost:9090
    chat-store-service: http://localhost:8100
    ws-service: http://localhost:8090
    push-service: http://localhost:9990
    storage-service: http://localhost:9999
    profile-service: http://localhost:8880
    point-service: http://localhost:9600
    schedule-service: http://localhost:8110
    commerce-service: http://localhost:8200

spring:
  kafka:
    producer:
      bootstrap-servers: localhost:29092
    consumer:
      bootstrap-servers: localhost:29092
  data:
    # IDE 실행은 modu_infra 의 단일 노드 redis(localhost:6379)에 붙는다.
    # 클러스터 노드는 도커 네트워크 안에서만 풀리는 호스트명을 광고해 호스트에서 붙을 수 없다.
    # 클라이언트 코드는 cluster.nodes 유무로 분기하므로 설정만 다르다.
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
