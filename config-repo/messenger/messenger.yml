# 메신저(modu_chat) 서비스 전용 설정. 각 서비스가 spring.cloud.config.name=messenger,<서비스 이름> 으로 받아 간다.
# 커머스 서비스에는 내려가지 않는다(datasource 비밀번호 등이 섞이면 안 된다).
spring:
  kafka:
    producer:
      bootstrap-servers: kafka:9092
    consumer:
      bootstrap-servers: kafka:9092
  data:
    redis:
      cluster:
        nodes:
          - redis-node-1:6379
          - redis-node-2:6379
          - redis-node-3:6379
          - redis-node-4:6379
          - redis-node-5:6379
          - redis-node-6:6379
      lettuce:
        cluster:
          refresh:
            adaptive: true
            period: 30s
