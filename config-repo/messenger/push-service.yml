# push-service 전용. Firebase Admin 서비스 계정 키(JSON) — 전에는 gitignore 된 firebase/*.json 파일로 넣었다.
# JSON 을 base64 로 감싼 뒤 {cipher} 로 암호화했다: /encrypt 는 '{' 로 시작하는 본문을 키 접두사로 해석해 평문으로 흘리기 때문.
#   base64 -i key.json | tr -d '\n' | curl -s -X POST http://localhost:8888/encrypt -H 'X-Internal-Token: …' --data-binary @-
# 로컬에서 설정 서버 없이 띄울 때는 classpath firebase/ 파일로 대신한다(FirebaseConfig).
modu:
  push:
    firebase:
      credentials-base64: '{cipher}'
