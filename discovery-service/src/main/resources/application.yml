server:
  port: 8761
  # SIGTERM 뒤 새 요청은 거절하고 처리 중인 요청은 끝까지 보낸다(롤링 배포·재시작 때 요청이 끊기지 않게).
  shutdown: graceful

spring:
  application:
    name: discovery-service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      # /actuator/health/liveness, /actuator/health/readiness (쿠버네티스 probe·compose healthcheck 용)
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # 레지스트리 서버 자체가 떴는지만 본다. 등록된 인스턴스 수나 설정 서버 연결은 readiness 조건이 아니다.
          include: readinessState
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
