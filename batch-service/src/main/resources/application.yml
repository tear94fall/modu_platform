server:
  port: 8910
  # SIGTERM 뒤 새 요청은 거절하고 처리 중인 요청은 끝까지 보낸다(롤링 배포·재시작 때 요청이 끊기지 않게).
  shutdown: graceful

spring:
  application:
    name: batch-service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

  cloud:
    # 설정 서버를 못 만나면 기본값으로 조용히 뜨지 않고 기동에 실패한다(k8s 가 다시 띄운다). 다른 서비스와 같은 규칙.
    # 공통(application.yml: modu.internal-api.token, modu.services.*) + 자기 파일(batch-service.yml: datasource, batch.*)을 받는다.
    config:
      fail-fast: true

  # 배치 DB(modu-platform.batch_job·batch_job_run·batch_job_change·shedlock). spring.datasource.master(mysql-platform)·replica(mysql-platform-replica)와
  # jpa.hibernate.ddl-auto(validate, master 에만 적용)는 config-repo/batch-service.yml 이 내려준다 — 여기에 datasource 기본값을 두지 않는다(비밀번호는 {cipher}).
  # RW/RO 라우팅은 RwJpaConfig·RoJpaConfig·JpaBatchJobStore. 스키마는 modu_infra data/mysql/schema/platform.modu-platform.sql.
  jpa:
    open-in-view: false

# modu.internal-api.token·modu.services.* 는 config-repo 의 application.yml 이 내려준다. 여기 기본값을 두지 않는다 —
# 토큰이 비어 있으면 InternalTokenFilter 가 기동을 거부한다(빈 토큰은 누구나 통과시키므로).

# batch.* 기본값. config-repo/batch-service.yml 이 덮어쓴다.
batch:
  run:
    connect-timeout-seconds: 5      # 서비스에 붙는 시간
    default-timeout-seconds: 600    # 잡 정의에 타임아웃이 없을 때 회차 하나를 기다리는 시간
    max-timeout-seconds: 3600       # 콘솔이 줄 수 있는 타임아웃 상한
  scheduler:
    pool-size: 5                    # 동시에 돌 수 있는 회차 수(잡은 서로 다른 것만 — 같은 잡은 하나)
  store:
    capacity: 500                   # 목록 API 가 돌려주는 최대 건수(DB 에는 전부 남는다)

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      # /actuator/health/liveness, /actuator/health/readiness (쿠버네티스 probe 용)
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # 서비스가 떴고 배치 DB master 에 붙어 있는지 본다(masterDb, MasterDbHealthConfig). 자동 db 는 replica 까지 보므로 넣지 않는다.
          include: readinessState, masterDb
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  default-produces-media-type: application/json
  paths-to-exclude: /actuator/**, /error
